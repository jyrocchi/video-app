<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>JyroCam</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">●</span>
      <span>JyroCam</span>
    </div>
    <div class="status">
      <span id="connDot" class="dot"></span>
      <span id="connText">Sin senal</span>
      <span class="sep">|</span>
      <span id="fpsText">-- fps</span>
      <span class="sep">|</span>
      <span id="resolutionText">—</span>
      <span class="sep">|</span>
      <span id="bitrateText">-- kbps H.264</span>
      <span class="sep">|</span>
      <span id="sizeText">-- KB/cuadro</span>
    </div>
  </header>

  <main>
<div id="frameBox">
      <img id="frame" alt="">
      <div id="blackoutOverlay" class="hidden">
        <div class="lock-icon">🔒</div>
        <div class="blackout-title">Vista oculta</div>
        <div class="blackout-sub">La transmisión continúa</div>
      </div>
      <div id="placeholder">
        <div class="big-icon">📱</div>
        <h2>Esperando conexion del celular</h2>
        <p>Abre la app <b>JyroCam</b> en tu Android y configura tu dirección IPv4:</p>
        <div id="phoneUrlBox"></div>
        <span id="portText" style="display:none">8080</span>
      </div>
    </div>
  </main>

  <footer>
    <div class="left">
      <button id="recordBtn" class="btn-primary">
        <span class="rec-dot"></span>
        <span id="recordLabel">Grabar</span>
      </button>
      <button id="openFolderBtn" class="btn-secondary">Abrir carpeta</button>
      <button id="virtualCamBtn" class="btn-secondary">Instalar cámara virtual</button>
    </div>
    <div class="right">
      <label class="toggle">
        <input type="checkbox" id="ndiToggle">
        <span>Salida NDI</span>
      </label>
      <span id="ndiStatus" class="ndi-status"></span>
      <button id="blackoutBtn" class="btn-secondary" type="button" aria-pressed="false">Oscurecer vista</button>
    </div>
  </footer>

  <div id="recIndicator" class="rec-indicator hidden">
    <span class="rec-dot"></span>
    <span id="recTime">00:00</span>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const img = $('frame');
img.addEventListener('load', () => {
  $('resolutionText').textContent = `${img.naturalWidth}×${img.naturalHeight}`;
  requestAnimationFrame(() => window.api.frameRendered());
});
const placeholder = $('placeholder');
const phoneUrlBox = $('phoneUrlBox');
const portText = $('portText');
const connDot = $('connDot');
const connText = $('connText');
const fpsText = $('fpsText');
const sizeText = $('sizeText');
const recordBtn = $('recordBtn');
const recordLabel = $('recordLabel');
const openFolderBtn = $('openFolderBtn');
const recIndicator = $('recIndicator');
const recTime = $('recTime');
const ndiToggle = $('ndiToggle');
const ndiStatus = $('ndiStatus');
const virtualCamBtn = $('virtualCamBtn');
const blackoutBtn = $('blackoutBtn');
const blackoutOverlay = $('blackoutOverlay');

let blackoutOn = false;
function applyBlackout(on) {
  blackoutOn = !!on;
  blackoutOverlay.classList.toggle('hidden', !blackoutOn);
  blackoutBtn.classList.toggle('active', blackoutOn);
  blackoutBtn.textContent = blackoutOn ? 'Mostrar vista' : 'Oscurecer vista';
  blackoutBtn.setAttribute('aria-pressed', blackoutOn ? 'true' : 'false');
}
blackoutBtn.addEventListener('click', async () => {
  blackoutBtn.disabled = true;
  try {
    const res = await window.api.setBlackout(!blackoutOn);
    applyBlackout(res.blackout);
  } catch (e) {
    applyBlackout(false);
  } finally {
    blackoutBtn.disabled = false;
  }
});

let recording = false;
let recordingStart = 0;
let recTimer = null;
let virtualCamBusy = false;

function updateVirtualCamButton(info) {
  if (virtualCamBusy) return;
  if (!info.virtualCamInstalled) {
    virtualCamBtn.textContent = 'Instalar cámara virtual';
    virtualCamBtn.disabled = false;
  } else if (info.virtualCamConnected) {
    virtualCamBtn.textContent = info.virtualCamUpdated
      ? 'JyroCam conectada' : 'Desconecta JyroCam para actualizar';
    virtualCamBtn.disabled = true;
  } else if (info.virtualCamUpdated) {
    virtualCamBtn.textContent = 'Quitar cámara virtual';
    virtualCamBtn.disabled = false;
  } else {
    virtualCamBtn.textContent = 'Actualizar cámara virtual';
    virtualCamBtn.disabled = false;
  }
}

async function init() {
  const info = await window.api.getInfo();
  portText.textContent = info.port;
  const ip = info.ips[0] || 'localhost';
  phoneUrlBox.innerHTML = `<code>${ip}</code>`;

  ndiToggle.checked = info.ndi;
  updateVirtualCamButton(info);
  if (info.ndi) {
    ndiStatus.textContent = 'Activo';
    ndiStatus.className = 'ndi-status on';
  } else if (info.ndiError) {
    ndiStatus.textContent = 'NDI no disponible';
    ndiStatus.className = 'ndi-status off';
  } else {
    ndiStatus.textContent = '';
  }
}

window.api.onEvent((payload) => {
  if (payload.type === 'frame') {
    placeholder.style.display = 'none';
    img.src = 'data:image/jpeg;base64,' + payload.b64;
    img.style.display = blackoutOn ? 'none' : 'block';
    connDot.classList.add('on');
    connText.textContent = 'Conectado';
    sizeText.textContent = Math.round(payload.size / 1024) + ' KB/cuadro';
  } else if (payload.type === 'fps') {
    fpsText.textContent = payload.value + ' fps';
  } else if (payload.type === 'stream-disconnected') {
    img.removeAttribute('src');
    img.style.display = 'none';
    placeholder.style.display = blackoutOn ? 'none' : 'flex';
    connDot.classList.remove('on');
    connText.textContent = 'Sin señal';
    $('bitrateText').textContent = '-- kbps H.264';
    fpsText.textContent = '-- fps';
    sizeText.textContent = '-- KB/cuadro';
  } else if (payload.type === 'recording-started') {
    recording = true;
    recordingStart = Date.now();
    recordLabel.textContent = 'Detener';
    openFolderBtn.disabled = false;
    recIndicator.classList.remove('hidden');
    recTimer = setInterval(() => {
      const sec = Math.floor((Date.now() - recordingStart) / 1000);
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      recTime.textContent = `${m}:${s}`;
    }, 250);
  } else if (payload.type === 'recording-stopped') {
    recording = false;
    recordLabel.textContent = 'Grabar';
    recIndicator.classList.add('hidden');
    if (recTimer) { clearInterval(recTimer); recTimer = null; }
  } else if (payload.type === 'recording-error') {
    alert('Error en grabacion: ' + payload.message);
    recording = false;
    recordLabel.textContent = 'Grabar';
    recIndicator.classList.add('hidden');
    if (recTimer) { clearInterval(recTimer); recTimer = null; }
  } else if (payload.type === 'server-error') {
    if (payload.code === 'EADDRINUSE') {
      const placeholderEl = document.getElementById('placeholder');
      placeholderEl.innerHTML = `
        <div class="big-icon">⚠️</div>
        <h2>Puerto ${payload.port} ocupado</h2>
        <p>Cierra el proceso que lo usa y reinicia la app.</p>
        <p style="margin-top:8px;font-size:12px;opacity:0.7">PowerShell: <code>Get-NetTCPConnection -LocalPort ${payload.port} | Stop-Process -Force</code></p>
      `;
    }
  } else if (payload.type === 'decoder-error') {
    connText.textContent = 'Error de vídeo: ' + payload.message;
  }
});

recordBtn.addEventListener('click', async () => {
  recordBtn.disabled = true;
  try {
    if (recording) {
      const res = await window.api.stopRecording();
      if (!res.ok) alert('No se pudo detener la grabacion: ' + (res.error || ''));
    } else {
      const res = await window.api.startRecording({});
      if (!res.ok) alert('No se pudo iniciar la grabacion: ' + (res.error || ''));
    }
  } catch (error) {
    alert('Error de grabacion: ' + error.message);
  } finally {
    recordBtn.disabled = false;
  }
});

openFolderBtn.addEventListener('click', async () => {
  try {
    const result = await window.api.openFolder();
    if (!result.ok) alert('No se pudo abrir Videos: ' + (result.error || ''));
  } catch (error) {
    alert('No se pudo abrir Videos: ' + error.message);
  }
});

virtualCamBtn.addEventListener('click', async () => {
  virtualCamBusy = true;
  virtualCamBtn.disabled = true;
  const installing = !virtualCamBtn.textContent.startsWith('Quitar');
  try {
    const result = await window.api.setVirtualCamera(installing);
    if (!result.ok) throw new Error(result.error || 'No se pudo cambiar el registro de la cámara.');
    alert(result.installed
      ? 'JyroCam quedó instalada como cámara virtual para este usuario. Cierra y vuelve a abrir Zoom/Discord para que aparezca.'
      : 'La cámara virtual JyroCam quedó desinstalada.');
  } catch (error) {
    alert(`Error con la cámara virtual: ${error.message}`);
  } finally {
    virtualCamBusy = false;
    try { updateVirtualCamButton(await window.api.getInfo()); }
    catch (_) { virtualCamBtn.disabled = false; }
  }
});

ndiToggle.addEventListener('change', async () => {
  const res = await window.api.toggleNdi();
  if (res.ndi) {
    ndiStatus.textContent = 'Activo';
    ndiStatus.className = 'ndi-status on';
  } else {
    ndiStatus.textContent = res.ndiError ? 'NDI no disponible' : '';
    ndiStatus.className = 'ndi-status off';
  }
  ndiToggle.checked = res.ndi;
});

setInterval(async () => {
  const info = await window.api.getInfo();
  if (!info.ndi) ndiToggle.checked = false;
  updateVirtualCamButton(info);
}, 3000);

setInterval(async () => {
  try {
    const status = await (await fetch(`http://127.0.0.1:${portText.textContent}/status`)).json();
    $('bitrateText').textContent = `${status.h264?.bitrateKbps || 0} kbps H.264`;
  } catch (_) {}
}, 1000);

init();
</script>
</body>
</html>
