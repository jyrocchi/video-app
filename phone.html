<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Transmisor de Cámara</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0a0a0a;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    gap: 14px;
  }
  h1 { font-size: 18px; font-weight: 500; opacity: 0.9; }
  #preview {
    width: 100%;
    max-width: 480px;
    aspect-ratio: 4 / 3;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #preview video, #preview canvas {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #preview canvas { display: none; }
  #status {
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 16px;
    background: #222;
    color: #aaa;
  }
  #status.live { background: #0a4; color: #fff; }
  #status.error { background: #a33; color: #fff; }
  .controls {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 480px;
  }
  button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    background: #1a73e8;
    color: #fff;
  }
  button.stop { background: #d33; }
  button:disabled { background: #333; color: #888; }
  .row {
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 480px;
  }
  select, input[type=range] {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: #1a1a1a;
    color: #fff;
    font-size: 14px;
  }
  label { font-size: 12px; color: #888; }
</style>
</head>
<body>
  <h1>📱 Transmisor de Cámara</h1>
  <div id="preview">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>
  <div id="status">Detenido</div>

  <div class="row">
    <select id="cameraSelect"></select>
  </div>
  <div class="row">
    <label>Calidad
      <select id="quality">
        <option value="0.5">Baja (rápido)</option>
        <option value="0.7" selected>Media</option>
        <option value="0.85">Alta</option>
      </select>
    </label>
    <label>FPS
      <select id="fps">
        <option value="10">10</option>
        <option value="15" selected>15</option>
        <option value="24">24</option>
        <option value="30">30</option>
      </select>
    </label>
  </div>

  <div class="controls">
    <button id="startBtn">Iniciar transmisión</button>
    <button id="stopBtn" class="stop" disabled>Detener</button>
  </div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const statusEl = document.getElementById('status');
const cameraSelect = document.getElementById('cameraSelect');
const qualitySel = document.getElementById('quality');
const fpsSel = document.getElementById('fps');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');

let stream = null;
let timer = null;
let sending = false;

async function listCameras() {
  try {
    const tmp = await navigator.mediaDevices.getUserMedia({ video: true });
    const devices = await navigator.mediaDevices.enumerateDevices();
    tmp.getTracks().forEach(t => t.stop());
    cameraSelect.innerHTML = '';
    devices.filter(d => d.kind === 'videoinput').forEach((d, i) => {
      const opt = document.createElement('option');
      opt.value = d.deviceId;
      opt.textContent = d.label || `Cámara ${i + 1}`;
      cameraSelect.appendChild(opt);
    });
  } catch (e) {
    setStatus('Permiso de cámara denegado', 'error');
  }
}

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls || '';
}

async function start() {
  const deviceId = cameraSelect.value || undefined;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        deviceId: deviceId ? { exact: deviceId } : undefined,
        facingMode: deviceId ? undefined : 'environment',
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    setStatus('Transmitiendo...', 'live');
    startBtn.disabled = true;
    stopBtn.disabled = false;
    cameraSelect.disabled = true;
    qualitySel.disabled = true;
    fpsSel.disabled = true;
    scheduleLoop();
  } catch (e) {
    setStatus('Error: ' + e.message, 'error');
  }
}

function scheduleLoop() {
  const fps = parseInt(fpsSel.value, 10) || 15;
  const interval = Math.max(33, Math.floor(1000 / fps));
  timer = setInterval(captureAndSend, interval);
}

function captureAndSend() {
  if (sending || !stream) return;
  sending = true;
  const w = video.videoWidth, h = video.videoHeight;
  if (!w || !h) { sending = false; return; }
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, w, h);
  const quality = parseFloat(qualitySel.value) || 0.7;
  const dataUrl = canvas.toDataURL('image/jpeg', quality);
  fetch('/upload', {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: dataUrl
  }).catch(() => setStatus('Sin conexión al servidor', 'error'))
    .finally(() => { sending = false; });
}

function stop() {
  if (timer) { clearInterval(timer); timer = null; }
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  video.srcObject = null;
  setStatus('Detenido');
  startBtn.disabled = false;
  stopBtn.disabled = true;
  cameraSelect.disabled = false;
  qualitySel.disabled = false;
  fpsSel.disabled = false;
}

startBtn.addEventListener('click', start);
stopBtn.addEventListener('click', stop);
cameraSelect.addEventListener('change', () => { if (stream) { stop(); start(); } });

listCameras();
navigator.mediaDevices.addEventListener('devicechange', listCameras);
</script>
</body>
</html>
